name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build single-file exe
        run: >
          pyinstaller
          --onefile
          --name pz-save-manager
          --collect-submodules watchdog
          --collect-submodules flask
          --collect-data pz_save_manager
          --noconfirm
          scripts/pz_save_manager_app.py

      - name: Smoke-test the binary
        shell: pwsh
        run: |
          $exe = "dist/pz-save-manager.exe"
          if (-not (Test-Path $exe)) { throw "exe not produced" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Built pz-save-manager.exe ($([math]::Round($size,1)) MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pz-save-manager-windows
          path: dist/pz-save-manager.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pz-save-manager.exe
          generate_release_notes: true
